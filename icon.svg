<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Hextech Ledger: a brass-framed hex plate with an arcane core, and three
       ledger rules struck through it. Cut corners, no soft edges. -->
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0a92a"/>
      <stop offset="1" stop-color="#8a5e05"/>
    </linearGradient>
    <linearGradient id="arcane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9df6ff"/>
      <stop offset="0.5" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#0a8fb5"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- plate, corners chamfered rather than rounded -->
  <path d="M96 16 H416 L496 96 V416 L416 496 H96 L16 416 V96 Z" fill="#0f141c"/>
  <path d="M96 16 H416 L496 96 V416 L416 496 H96 L16 416 V96 Z"
        fill="none" stroke="url(#brass)" stroke-width="12"/>

  <circle cx="256" cy="256" r="180" fill="url(#core)"/>

  <!-- outer hex frame -->
  <path d="M256 84 L404 170 V342 L256 428 L108 342 V170 Z"
        fill="none" stroke="url(#brass)" stroke-width="14" stroke-linejoin="miter"/>

  <!-- inner hex, the charged one -->
  <path d="M256 140 L352 196 V308 L256 364 L160 308 V196 Z"
        fill="none" stroke="url(#arcane)" stroke-width="16" stroke-linejoin="miter"/>

  <!-- ledger rules struck across the core -->
  <g stroke="url(#arcane)" stroke-width="14" stroke-linecap="square">
    <line x1="196" y1="216" x2="316" y2="216"/>
    <line x1="196" y1="256" x2="316" y2="256"/>
    <line x1="196" y1="296" x2="272" y2="296"/>
  </g>
</svg>
